services:
  api-1:
    build: .
    container_name: api-1
    environment:
      INSTANCE_NAME: api-1

  api-2:
    build: .
    container_name: api-2
    environment:
      INSTANCE_NAME: api-2

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8100:8000"
      - "8101:8001"
    depends_on:
      - api
