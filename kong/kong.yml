_format_version: "3.0"

upstreams:
  - name: api-upstream
    healthchecks:
      active:
        http_path: /health
        timeout: 1
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 2
          http_failures: 2
          timeouts: 2
    targets:
      - target: api-1:8000
        weight: 100
      - target: api-2:8000
        weight: 50

services:
  - name: api
    host: api-upstream
    port: 8000
    connect_timeout: 1000
    read_timeout: 2000
    write_timeout: 1000
    retries: 2
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - X-API-Key
          - name: rate-limiting
            config:
              minute: 5
              limit_by: consumer
              policy: local
      - name: health-route
        paths:
          - /health
        strip_path: false
      - name: admin-route
        paths:
          - /admin
        strip_path: false
        plugins:
          - name: request-termination
            config:
              status_code: 403
              message: "Access denied"

consumers:
  - username: client-a
    keyauth_credentials:
      - key: abc123
  - username: client-b
    keyauth_credentials:
      - key: def456
  
